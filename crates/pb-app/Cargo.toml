[package]
name = "pb-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
    pb-core = { path = "../pb-core" }
    pb-rng = { path = "../pb-rng" }
    pb-rules = { path = "../pb-rules" }
    pb-sim = { path = "../pb-sim" }
    pb-ai = { path = "../pb-ai" }
    pb-content = { path = "../pb-content" }
    pb-save = { path = "../pb-save" }
    pb-render = { path = "../pb-render" }
    pb-audio = { path = "../pb-audio" }
    pb-cli = { path = "../pb-cli" }
    serde.workspace = true
    ron.workspace = true
    tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
    wgpu.workspace = true
    winit.workspace = true
    bytemuck.workspace = true

[[bin]]
name = "powderburn"
path = "src/main.rs"
