[package]
name = "pb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
default = []
replay-server = []

[dependencies]
    pb-core = { path = "../pb-core" }
    pb-rng = { path = "../pb-rng" }
    pb-rules = { path = "../pb-rules" }
    pb-sim = { path = "../pb-sim" }
    pb-ai = { path = "../pb-ai" }
    pb-content = { path = "../pb-content" }
    pb-save = { path = "../pb-save" }
    pb-render = { path = "../pb-render" }
    pb-audio = { path = "../pb-audio" }
    serde = { workspace = true }
    ron = { workspace = true }
    tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
    wgpu = { workspace = true }

[[bin]]
name = "pbcli"
path = "src/main.rs"
